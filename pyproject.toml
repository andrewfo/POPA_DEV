[project]
name = "popa-wharf"
version = "0.1.0"
description = "Unified berth + dredging scheduling data layer for the Port of Port Arthur"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "websockets>=12.0",
    "shapely>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Production server (used in the Docker image). POSIX-only — installs on Windows
# but can't run there; local dev uses uvicorn directly.
prod = [
    "gunicorn>=21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: tests that require a live Postgres+PostGIS database (set DATABASE_URL)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Generated / vendored dirs the linter should not police.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# A deliberately small, high-signal starter set: pyflakes (real errors — unused
# names, bad f-strings), a pycodestyle subset, isort, pyupgrade, flake8-bugbear.
# Style-only noise (line length, etc.) stays off until the tree is clean; widen
# this over time rather than starting strict and drowning the gate.
select = ["F", "E9", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/param markers are *meant* to be called in argument
# defaults — that's the framework's idiom, not the B008 mutable-default bug the
# rule targets. Treat them as immutable so B008 stops flagging every endpoint.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

