# Local-dev Postgres + PostGIS. Not for production.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: popa_wharf_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-popa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popa}
      POSTGRES_DB: ${POSTGRES_DB:-popa_wharf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - popa_wharf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-popa} -d ${POSTGRES_DB:-popa_wharf}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  popa_wharf_pgdata:
